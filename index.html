<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd3ff" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ffc83d'/%3E%3Crect x='18' y='14' width='28' height='24' rx='6' fill='%23f2c79a'/%3E%3Crect x='14' y='38' width='36' height='18' rx='5' fill='%23e2483d'/%3E%3C/svg%3E" />
    <title>Mingalar World</title>
    <meta name="description" content="Explore a 3D town in the browser: shop the Virtual Mall, mod and race cars at the Virtual Garage, visit the Virtual Office and test your aim at the Gun Range." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Minimal HUD: everything here floats over the 3D world -->
    <div id="hud">
      <div id="hud-top" class="pill" hidden></div>
      <div id="top-right">
        <button id="cart-chip" class="pill" hidden></button>
        <button id="btn-customize" class="pill" title="Customise your character (C)">👕 Avatar</button>
        <button id="btn-view" class="pill" title="Switch camera (V)">🎥 3rd</button>
        <button id="help-btn" class="round" aria-label="Controls">?</button>
      </div>
      <div id="help" class="card" hidden></div>

      <div id="minimap">
        <div id="minimap-frame">
          <canvas id="minimap-canvas"></canvas>
          <span class="n">N</span>
          <button id="minimap-toggle" aria-label="Minimise map" title="Minimise map (M)">–</button>
        </div>
        <button id="minimap-open" class="round" aria-label="Show map" title="Show map (M)">🗺️</button>
      </div>

      <div id="crosshair"><i></i><i></i><i></i><i></i></div>
      <div id="scope"></div>
      <div id="power" hidden><div id="power-fill"></div></div>
      <div id="hint" hidden></div>
      <button id="prompt" class="pill" hidden></button>
      <div id="toasts"></div>

      <div id="joy" hidden><div id="joy-knob"></div></div>
      <div id="touch-btns" hidden>
        <button id="btn-fire" class="round big" hidden>Fire</button>
        <button id="btn-run" class="round big">Run</button>
        <button id="btn-jump" class="round big">Jump</button>
      </div>
    </div>

    <aside id="panel" hidden>
      <header>
        <div>
          <div id="panel-kicker"></div>
          <h2 id="panel-title"></h2>
        </div>
        <button id="panel-close" class="round" aria-label="Close">✕</button>
      </header>
      <div id="panel-body"></div>
    </aside>

    <div id="fade"></div>

    <div id="start">
      <div class="start-card">
        <div class="start-kicker">Welcome to</div>
        <h1>Mingalar World</h1>
        <p id="start-controls"></p>
        <button id="start-btn" disabled>Loading…</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
