<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#8fd3ff" />
    <title>Virtual Luxury Home</title>
    <meta name="description" content="Explore a small 3D town: play mini golf, browse the mall, visit the garage, gym, pool and luxury home gallery." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <!-- Minimal HUD: everything here floats over the 3D world -->
    <div id="hud">
      <div id="hud-top" class="pill" hidden></div>
      <button id="cart-chip" class="pill" hidden></button>
      <button id="help-btn" class="round" aria-label="Controls">?</button>
      <div id="help" class="card" hidden></div>

      <div id="power" hidden><div id="power-fill"></div></div>
      <div id="hint" hidden></div>
      <button id="prompt" class="pill" hidden></button>
      <div id="toasts"></div>

      <div id="joy" hidden><div id="joy-knob"></div></div>
      <div id="touch-btns" hidden>
        <button id="btn-run" class="round big">Run</button>
        <button id="btn-jump" class="round big">Jump</button>
      </div>
    </div>

    <aside id="panel" hidden>
      <header>
        <div>
          <div id="panel-kicker"></div>
          <h2 id="panel-title"></h2>
        </div>
        <button id="panel-close" class="round" aria-label="Close">✕</button>
      </header>
      <div id="panel-body"></div>
    </aside>

    <div id="start">
      <div class="start-card">
        <div class="start-kicker">Explore the town</div>
        <h1>Virtual Luxury Home</h1>
        <p id="start-controls"></p>
        <button id="start-btn" disabled>Loading…</button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
